[project]
name = "wscribe"
version = "0.1.5"
description = "ez audio transcription tool with flexible processing and post-processing options"
authors = [
    { name = "Hrishikesh Barman", email = "oss@geekodour.org" }
]
license = { text = "MIT" }
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "structlog>=23.1.0",
    "faster-whisper>=0.9.0",
    "click>=8.1.6",
]

[project.urls]
Homepage = "https://github.com/geekodour/wscribe"

[project.scripts]
wscribe = "wscribe.cli.main:cli"

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4.3"]

[dependency-groups]
dev = [
    "pudb>=2022.1.3",
    "ipython>=8.13.2",
    "isort>=5.12.0",
    "ruff>=0.0.270",
    "black>=23.3.0",
    "snoop>=0.4.3",
]
test = [
    "pytest>=7.3.1",
    "mypy>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wscribe"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
